name: Frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Throwaway values so the production server starts without the backend.
      APP_PASSWORD: ci-only-password
      SESSION_SECRET: ci-only-session-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Start the production server
        run: |
          nohup npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          echo "Server did not come up"; cat server.log; exit 1

      - name: Load the sign-in page
        run: |
          code=$(curl -sS -o login.html -w "%{http_code}" http://localhost:3000/login)
          echo "GET /login -> $code"
          test "$code" = "200"
          grep -q "Sign in" login.html

      - name: Protected pages redirect to sign-in
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:3000/opportunities)
          echo "GET /opportunities -> $code"
          test "$code" = "307"

      - name: Show server log on failure
        if: failure()
        run: cat server.log || true
